# CI: install → migrations in sync with schema.ts → typecheck → unit tests → migrations + integration tests (Postgres)
#     → web build, plus Docker image builds.
#
# Where jobs run
# - Pull requests (including forks) ALWAYS run on GitHub-hosted ubuntu-latest: free for public repositories
#   and isolated from your own hardware.
# - Pushes to main and manual runs also use ubuntu-latest by default. Setting the repository variable
#   OPENGEO_SELF_HOSTED=true moves these (trusted) runs to a self-hosted runner labelled "opengeo".
#   Read CONTRIBUTING.md ("CI and self-hosted runners") before enabling it: the condition below lives in this
#   file, and a pull request can edit this file, so it is not a security boundary on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Tests never call paid APIs
  OPENGEO_MOCK_ENGINES: "1"

jobs:
  test:
    name: Typecheck, tests, web build
    runs-on: ${{ (github.event_name != 'pull_request' && vars.OPENGEO_SELF_HOSTED == 'true') && fromJSON('["self-hosted","opengeo"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      # Throwaway Postgres for the integration tests (started below; a free port so it never clashes on a self-hosted machine)
      PG_CONTAINER: opengeo-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_DATABASE_URL: postgres://opengeo:opengeo@127.0.0.1:55439/opengeo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails when packages/db/src/schema.ts was changed without `pnpm db:generate`. Needs no database.
      # drizzle-kit exits 0 on errors (e.g. the rename prompt, which needs a TTY), so its output is checked too.
      # Hand edits to an existing .sql file are not detected here.
      - name: Migrations match schema.ts
        run: |
          log="$RUNNER_TEMP/drizzle-generate.log"
          pnpm db:generate 2>&1 | tee "$log"
          if grep -qiE 'error|warning' "$log"; then
            echo "::error::drizzle-kit generate failed (renames need an interactive 'pnpm db:generate'). Run it locally and commit packages/db/drizzle."; exit 1
          fi
          pnpm --filter @opengeo/db exec drizzle-kit check 2>&1 | tee "$log"
          if [ "${PIPESTATUS[0]}" -ne 0 ] || grep -qiE 'error|warning' "$log"; then
            echo "::error::drizzle-kit check found problems in packages/db/drizzle (e.g. colliding migrations after a merge)."; exit 1
          fi
          changes=$(git status --porcelain --untracked-files=all -- packages/db/drizzle)
          if [ -n "$changes" ]; then
            echo "::error::packages/db/src/schema.ts has changes without a migration. Run 'pnpm db:generate' and commit packages/db/drizzle."
            echo "$changes"; git diff -- packages/db/drizzle; exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # A plain container instead of `services:` so the same steps also work on a self-hosted macOS runner
      # (service containers are Linux-only).
      - name: Start Postgres
        run: |
          docker run -d --rm --name "$PG_CONTAINER" \
            -e POSTGRES_USER=opengeo -e POSTGRES_PASSWORD=opengeo -e POSTGRES_DB=opengeo \
            -p 127.0.0.1:55439:5432 postgres:17
          for i in $(seq 1 30); do
            docker exec "$PG_CONTAINER" pg_isready -U opengeo -d opengeo -h 127.0.0.1 && exit 0
            sleep 2
          done
          docker logs "$PG_CONTAINER"; exit 1

      # Fresh database, then a second run that must be a no-op (the integration tests migrate their own opengeo_test)
      - name: Migrations (fresh database, run twice)
        env:
          DATABASE_URL: postgres://opengeo:opengeo@127.0.0.1:55439/opengeo
        run: |
          pnpm db:migrate
          pnpm db:migrate | tee "$RUNNER_TEMP/migrate-2.log"
          grep -q "Database is up to date" "$RUNNER_TEMP/migrate-2.log"

      - name: Integration tests
        run: pnpm test:integration

      - name: Build web
        env:
          # Only silences better-auth while prerendering; nothing secret is needed to build
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-used-anywhere
        run: pnpm --filter @opengeo/web build

      - name: Stop Postgres
        if: always()
        run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true

  docker:
    name: Docker images
    runs-on: ${{ (github.event_name != 'pull_request' && vars.OPENGEO_SELF_HOSTED == 'true') && fromJSON('["self-hosted","opengeo"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: false
          tags: opengeo-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Validate docker-compose files
        if: matrix.target == 'web'
        env:
          POSTGRES_PASSWORD: ci
          BETTER_AUTH_SECRET: ci
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
