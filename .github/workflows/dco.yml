# DCO: every commit of a pull request needs a "Signed-off-by" line matching its author (see CONTRIBUTING.md).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Commits signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$c")
            if git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by:" \
               && git log -1 --format='%B' "$c" | grep -i "^Signed-off-by:" | grep -qiF "<$email>"; then
              echo "ok   $(git log -1 --format='%h %s' "$c")"
            else
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") is not signed off by its author <$email>."
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease (see CONTRIBUTING.md)"
            exit 1
          fi
