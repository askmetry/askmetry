# Development database only (used by `pnpm db:up`): Postgres 17 on localhost:5433, user/password askmetry.
# The project name is pinned to "askmetry" so the container (askmetry-db-1) and volume (askmetry_askmetry-db) keep stable names.
# For self-hosting use docker-compose.yml instead.
name: askmetry
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: askmetry
      POSTGRES_PASSWORD: askmetry
      POSTGRES_DB: askmetry
    ports:
      - "5433:5432"
    volumes:
      - askmetry-db:/var/lib/postgresql/data
volumes:
  askmetry-db:
