# Askmetry self-hosting stack: Postgres + schema migration + web dashboard + worker.
#
#   cp .env.example .env     # fill in POSTGRES_PASSWORD, BETTER_AUTH_SECRET, BETTER_AUTH_URL, API keys
#   docker compose up -d     # builds the images on first run
#
# Development uses docker-compose.dev.yml instead (`pnpm db:up`: database only, port 5433).
# The project name is pinned so this stack never collides with the dev database in the same checkout;
# override it with `docker compose -p <name>` to run several instances.
name: askmetry-selfhost

# Shared by web and worker. The web app only needs the Anthropic key (brand profile suggestions);
# the engine keys below go to the worker alone, so the internet-facing container holds as few secrets as possible.
x-app-env: &app-env
  DATABASE_URL: postgres://askmetry:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/askmetry
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ASKMETRY_MOCK_ENGINES: ${ASKMETRY_MOCK_ENGINES:-0}
  ASKMETRY_MAX_BUDGET_USD: ${ASKMETRY_MAX_BUDGET_USD:-200}
  ASKMETRY_SITE_CHECK: ${ASKMETRY_SITE_CHECK:-1}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: askmetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: askmetry
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port: only the other services reach the database. Uncomment for local access (psql, backups):
    # ports:
    #   - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmetry -d askmetry"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: apply the versioned migrations (packages/db/drizzle), then exit. web and worker wait for it.
  # Safe to run on every start: already applied migrations are skipped, concurrent runs wait for each other.
  # A database created by an older Askmetry version (drizzle-kit push, no migration history) is adopted
  # if its schema matches the baseline; otherwise migrate fails with instructions and web/worker do not start.
  migrate:
    image: ${ASKMETRY_WORKER_IMAGE:-askmetry-worker:local}
    build:
      context: .
      target: worker
    restart: "no"
    working_dir: /app/packages/db
    command: ["node", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://askmetry:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/askmetry
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${ASKMETRY_WEB_IMAGE:-askmetry-web:local}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${ASKMETRY_PORT:-3010}}
      ASKMETRY_ALLOW_SIGNUP: ${ASKMETRY_ALLOW_SIGNUP:-true}
    ports:
      - "${ASKMETRY_BIND:-127.0.0.1}:${ASKMETRY_PORT:-3010}:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/auth/ok').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    image: ${ASKMETRY_WORKER_IMAGE:-askmetry-worker:local}
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      <<: *app-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      ASKMETRY_HEARTBEAT_FILE: /tmp/askmetry-worker-heartbeat
    # Der Worker schreibt bei jedem Durchgang und jeder Messung ein Lebenszeichen; älter als 2 h = hängt.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/askmetry-worker-heartbeat');process.exit(Date.now()-s.mtimeMs<7200000?0:1)"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No HTTP endpoint: health = "the process is running" (restart policy handles crashes).

volumes:
  db-data:
